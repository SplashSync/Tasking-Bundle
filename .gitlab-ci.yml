################################################################
# Set any variables we need
variables:
  # Configure mysql environment variables (https://hub.docker.com/r/_/mysql/)
  MYSQL_DATABASE:               tasking
  MYSQL_ROOT_PASSWORD:          tasking
  COMPOSER_MEMORY_LIMIT:        -1
  SYMFONY_DEPRECATIONS_HELPER:  disabled

################################################################
# Defined Pipeline Stages
stages:
#  - Symfony-5
  - Symfony-6
  - Symfony-7
#  - Symfony-8


################################################################
# Functional Tests
################################################################

.core_tests:    &core_tests
    stage:      tests
    tags:
        - Dedicated
    services:
        - mysql:5.7
    artifacts:
        when: always
        reports:
            junit: "$CI_PROJECT_DIR/*-report.xml"
    ################################################################################
    # Install & Configure Environment
    before_script:
        # Setup Travis
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/3.0/ci/configure.sh  | sh
        # Deploy Symfony Files
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/3.0/symfony/deploy.sh | sh
        # Setup Symfony Version & Create Database
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/3.0/symfony/configure.sh | sh
        # Install Symfony
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/3.0/symfony/install.sh | sh

    ################################################################################
    # Run Test Script
    script:
        # Execute Grumphp Testsuite
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/main/ci/grumphp.sh  | sh
        # Execute PhpUnit Tests
        - vendor/bin/phpunit --log-junit $CI_PROJECT_DIR/test-report.xml

    ################################################################################
    # Run After Script
    after_script:
      - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/main/ci/after.sh | sh

################################################################
# Symfony 7
################################################################

sf7:php-8.3:
    <<: *core_tests
    stage:            Symfony-7
    image:            registry.gitlab.com/badpixxel-projects/php-sdk:php-8.3
    variables:
        SYMFONY_REQUIRE: 7.*

sf7:php-8.2:
    <<: *core_tests
    stage:            Symfony-7
    image:            registry.gitlab.com/badpixxel-projects/php-sdk:php-8.2
    variables:
        SYMFONY_REQUIRE: 7.*

sf7:php-8.1:
    <<: *core_tests
    stage:            Symfony-7
    image:            registry.gitlab.com/badpixxel-projects/php-sdk:php-8.1
    variables:
        SYMFONY_REQUIRE: 7.*

################################################################
# Symfony 6
################################################################

sf6:php-8.3:
    <<: *core_tests
    stage:            Symfony-6
    image:            registry.gitlab.com/badpixxel-projects/php-sdk:php-8.3
    variables:
        SYMFONY_REQUIRE: 6.4.*

sf6:php-8.2:
    <<: *core_tests
    stage:            Symfony-6
    image:            registry.gitlab.com/badpixxel-projects/php-sdk:php-8.2
    variables:
        SYMFONY_REQUIRE: 6.4.*

sf6:php-8.1:
    <<: *core_tests
    stage:            Symfony-6
    image:            registry.gitlab.com/badpixxel-projects/php-sdk:php-8.1
    variables:
        SYMFONY_REQUIRE: 6.4.*

